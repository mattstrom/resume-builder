{{- if .Values.orchestration.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "resume-builder.orchestration.fullname" . }}-api
  labels:
    {{- include "resume-builder.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestration
  {{- with .Values.orchestration.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.orchestration.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.orchestration.ingress.path }}
            pathType: {{ .Values.orchestration.ingress.pathType }}
            backend:
              service:
                name: {{ include "resume-builder.orchestration.fullname" . }}
                port:
                  number: {{ .Values.orchestration.service.port }}
{{- end }}
