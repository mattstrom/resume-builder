{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-orchestration" (include "resume-builder.fullname" .)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resume-builder.fullname" . }}-orchestration
  labels:
    {{- include "resume-builder.labels" . | nindent 4 }}
type: Opaque
{{- if $existingSecret }}
data:
  anthropicApiKey: {{ index $existingSecret.data "anthropicApiKey" | default (.Values.orchestration.anthropicApiKey | b64enc) }}
  auth0ClientId: {{ index $existingSecret.data "auth0ClientId" | default (.Values.orchestration.auth0.clientId | b64enc) }}
{{- else }}
stringData:
  anthropicApiKey: {{ .Values.orchestration.anthropicApiKey | quote }}
  auth0ClientId: {{ .Values.orchestration.auth0.clientId | quote }}
{{- end }}
