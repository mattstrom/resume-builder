apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resume-builder.crdt.fullname" . }}
  labels:
    {{- include "resume-builder.labels" . | nindent 4 }}
    app.kubernetes.io/component: crdt
spec:
  replicas: {{ .Values.crdt.replicaCount }}
  selector:
    matchLabels:
      {{- include "resume-builder.crdt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resume-builder.crdt.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crdt
          image: "{{ .Values.crdt.image.repository }}:{{ .Values.crdt.image.tag }}"
          imagePullPolicy: {{ .Values.crdt.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 1234
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "resume-builder.fullname" . }}-postgres-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "resume-builder.fullname" . }}-postgres-user
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "resume-builder.postgresHost" . }}:5432/{{ .Values.postgres.database }}"
            - name: CRDT_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "resume-builder.fullname" . }}-crdt
                  key: internalKey
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.crdt.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.crdt.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crdt.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.crdt.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
