# Default values for resume-builder.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

domain: mattstrom.com

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

# -- Backend (NestJS API)
backend:
  replicaCount: 1
  image:
    repository: registry.mattstrom.com/resume-builder-backend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Web (Vite/React frontend)
web:
  replicaCount: 1
  image:
    repository: registry.mattstrom.com/resume-builder-web
    tag: latest
    pullPolicy: Always
  nodeConfigEnv: production
  service:
    type: ClusterIP
    port: 5173
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Orchestration (Mastra dev server)
orchestration:
  replicaCount: 1
  image:
    repository: registry.mattstrom.com/resume-builder-orchestration
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 4111
  anthropicApiKey: ''
  auth0:
    clientId: ''
  # Override which Postgres database Mastra uses (defaults to postgres.database)
  postgresDatabase: ''
  # Override the MCP endpoint the orchestration server connects to (defaults to
  # the ingress host that routes /mcp to the backend)
  mcpUrl: ''
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Dedicated ingress for the Mastra API (distinct from the Studio UI
  # ingress below), so API-only concerns (CORS, auth, rate-limiting) can be
  # set via annotations without affecting Studio.
  ingress:
    enabled: true
    host: mastra.mattstrom.com
    path: /api
    pathType: Prefix
    annotations: {}

# -- CRDT (Hocuspocus collaborative editing server)
crdt:
  replicaCount: 1
  image:
    repository: registry.mattstrom.com/resume-builder-crdt
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 1234
  # Shared HMAC secret used to authenticate backend -> crdt internal API calls
  # (auto-generated and preserved across upgrades if left blank)
  internalKey: ''
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Ingress
ingress:
  enabled: true
  className: traefik
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: resume-builder.mattstrom.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /graphql
          pathType: Prefix
          service: backend
        - path: /mcp
          pathType: Prefix
          service: backend
        - path: /.well-known
          pathType: Prefix
          service: backend
        - path: /collaboration
          pathType: Prefix
          service: crdt
    - host: mastra.mattstrom.com
      paths:
        - path: /
          pathType: Prefix
          service: orchestration
  tls: []
  #  - secretName: resume-builder-tls
  #    hosts:
  #      - resume.mattstrom.com

# -- PostgreSQL (CloudNativePG)
postgres:
  instances: 1
  database: resume-builder
  username: app
  password: ''
  storage: 5Gi

# -- PostgreSQL Backup CronJob
postgresBackup:
  enabled: true
  # Run daily at 3:00 AM
  schedule: '0 3 * * *'
  image:
    repository: postgres
    tag: '16'
    pullPolicy: IfNotPresent
  # Delete backups older than this many days (0 to disable cleanup)
  retentionDays: 7
  # PVC size for storing backups
  storage: 5Gi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Redis (BullMQ backing store)
redis:
  image:
    repository: redis
    tag: '7-alpine'
    pullPolicy: IfNotPresent
  port: 6379
  password: ''
  storage: 1Gi
  resources: {}

# -- PostgreSQL Restore Job (one-shot, opt-in)
postgresRestore:
  # Set to true and run helm upgrade to trigger a restore
  enabled: false
  # Backup filename to restore (e.g., "postgres_backup_20260325_140000.dump")
  # Use "latest" to automatically select the most recent backup
  backupFile: 'latest'
  # Increment this to create a new Job if re-running a restore
  jobId: '1'
  backoffLimit: 1
  # Auto-delete the Job after this many seconds (default: 24h)
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ''
